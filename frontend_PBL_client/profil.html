<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil - Perpustakaan Kelas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="perpustakaankelas.css">
</head>
<body>

  <nav class="navbar navbar-expand-md navbar-perpus">
    <div class="container" style="max-width: 1000px;">
      <a class="navbar-brand d-flex align-items-center gap-2" href="beranda.html">
        <span class="judul-situs h5 mb-0">Perpustakaan Kelas</span>
        <span class="badge rounded-pill bg-hijau">Halaman Peminjam</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="menu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="beranda.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="katalog.html">Katalog</a></li>
          <li class="nav-item"><a class="nav-link" href="riwayat.html">Riwayat</a></li>
          <li class="nav-item"><a class="nav-link active" href="profil.html">Profil</a></li>
          <li class="nav-item"><a class="nav-link" href="Perpustakaankelas.html">Keluar</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4" style="max-width: 1000px;">

    <h1 class="judul-kartu h2 fw-bold mb-4">Profil saya</h1>

    <div class="row g-4">

      <div class="col-md-6">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <h2 class="h6 fw-bold mb-3">Data diri:</h2>
            <dl class="row small mb-4" id="data-diri"></dl>
            <button type="button" id="btn-ubah" class="btn btn-outline-secondary btn-sm fw-bold">Ubah data diri</button>
            <div id="pesan-data" class="alert alert-success small mt-3 mb-0" hidden>Data diri berhasil disimpan.</div>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <h2 class="h6 fw-bold mb-3">Ubah password:</h2>
            <form id="form-password" novalidate>
              <div class="mb-3">
                <label for="pw-lama" class="form-label small fw-bold">Password lama</label>
                <input type="password" class="form-control" id="pw-lama">
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label for="pw-baru" class="form-label small fw-bold">Password baru</label>
                <input type="password" class="form-control" id="pw-baru">
                <div class="invalid-feedback"></div>
              </div>
              <div class="mb-4">
                <label for="pw-ulang" class="form-label small fw-bold">Ulangi password baru</label>
                <input type="password" class="form-control" id="pw-ulang">
                <div class="invalid-feedback"></div>
              </div>
              <div class="text-center">
                <button type="submit" class="btn btn-hijau">Simpan password</button>
              </div>
            </form>
            <div id="pesan-password" class="alert alert-success small mt-3 mb-0" hidden>Password berhasil diubah.</div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="profil.js"></script>
</body>
</html>
