<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katalog - Perpustakaan Kelas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="perpustakaankelas.css">
</head>
<body>

  <nav class="navbar navbar-expand-md navbar-perpus">
    <div class="container" style="max-width: 1000px;">
      <a class="navbar-brand d-flex align-items-center gap-2" href="beranda.html">
        <span class="judul-situs h5 mb-0">Perpustakaan Kelas</span>
        <span class="badge rounded-pill bg-hijau">Halaman Peminjam</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="menu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="beranda.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link active" href="katalog.html">Katalog</a></li>
          <li class="nav-item"><a class="nav-link" href="riwayat.html">Riwayat</a></li>
          <li class="nav-item"><a class="nav-link" href="profil.html">Profil</a></li>
          <li class="nav-item"><a class="nav-link" href="Perpustakaankelas.html">Keluar</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4" style="max-width: 1000px;">

    <h1 class="judul-kartu h2 fw-bold mb-4">Katalog buku</h1>

    <form id="form-cari" class="row g-2 mb-4">
      <div class="col-12 col-md">
        <input type="text" class="form-control" id="cari" placeholder="Cari Judul, Penulis, atau Kode">
      </div>
      <div class="col-7 col-md-auto">
        <select class="form-select" id="kategori">
          <option value="">Semua kategori</option>
          <option>Novel</option>
          <option>Pelajaran</option>
          <option>Komik</option>
          <option>Antologi</option>
        </select>
      </div>
      <div class="col-5 col-md-auto">
        <button type="submit" class="btn btn-hijau w-100 px-4">Cari</button>
      </div>
    </form>

    <div class="row g-4 row-cols-1 row-cols-sm-2 row-cols-lg-3" id="daftar-buku"></div>
    <p id="kosong" class="text-center text-muted mt-4" hidden>Buku tidak ditemukan.</p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="katalog.js"></script>
</body>
</html>
