<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daftar - Perpustakaan kelas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="perpustakaankelas.css">
</head>
<body>
    <main class="container py-5" style="max-width: 440px;">

        <header class="d-flex align-items-center flex-wrap gap-2 mb-4">
            <h1 class="judul-situs h3 mb-0">Perpustakaan kelas</h1>
            <span class="badge rounded-pill bg-hijau">Halaman Peminjam</span>
         </header>

         <section class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h2 class="judul-kartu h3 mb-1">Daftar akun baru</h2>
                <p class="small text-muted mb-3">Isi data dirimu. kolom bertanda (wajib) harus diisi.</p>

                <form id="form-daftar" novalidate>
                    <div class="mb-3">
                        <label for="nama" class="form-label fw-bold">Nama lengkap (wajib)</label>
                        <input type="text" class="form-control" id="nama">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label for="nim" class="form-label fw-bold">NIM / NIS (wajib)</label>
                        <input type="text" class="form-control" id="nim">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label for="kelas" class="form-label fw-bold">Kelas (wajib)</label>
                        <input type="text" class="form-control" id="kelas">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label for="hp" class="form-label fw-bold">No HP</label>
                        <input type="tel" class="form-control" id="hp">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">Password (wajib)</label>
                        <input type="password" class="form-control" id="password">
                        <div class="invalid-feedback"></div>
                    </div>
                    <div class="mb-3">
                        <label for="password2" class="form-label fw-bold">Ulangi password (wajib)</label>
                        <input type="password" class="form-control" id="password2">
                        <div class="invalid-feedback"></div>
                    </div>

                    <button type="submit" class="btn btn-hijau w-100">Daftar</button>
                </form>

                <div id="pesan-sukses" class="alert alert-success text-center small mt-3 mb-0" hidden>
                    Akun berhasil dibuat. Silakan masuk.
                </div>

                <p class="text-center small mt-4 mb-0">
                    Sudah punya akun? <a href="Perpustakaankelas.html" class="fw-bold" style="color:#17695d">Masuk</a>
                </p>
            </div>
         </section>
    </main>
    <script src="akunbaru.js"></script>
</body>
</html>
