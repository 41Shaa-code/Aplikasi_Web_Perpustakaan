<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riwayat - Perpustakaan Kelas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="perpustakaankelas.css">
</head>
<body>

  <nav class="navbar navbar-expand-md navbar-perpus">
    <div class="container" style="max-width: 1000px;">
      <a class="navbar-brand d-flex align-items-center gap-2" href="beranda.html">
        <span class="judul-situs h5 mb-0">Perpustakaan Kelas</span>
        <span class="badge rounded-pill bg-hijau">Halaman Peminjam</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="menu">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="beranda.html">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="katalog.html">Katalog</a></li>
          <li class="nav-item"><a class="nav-link active" href="riwayat.html">Riwayat</a></li>
          <li class="nav-item"><a class="nav-link" href="profil.html">Profil</a></li>
          <li class="nav-item"><a class="nav-link" href="Perpustakaankelas.html">Keluar</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4" style="max-width: 1000px;">

    <h1 class="judul-kartu h2 fw-bold mb-4">Riwayat peminjaman</h1>

    <div class="d-flex align-items-center gap-3 mb-4">
      <label for="status" class="fw-bold">Status</label>
      <select class="form-select w-auto" id="status">
        <option value="">Semua</option>
        <option>Dipinjam</option>
        <option>Dikembalikan</option>
        <option>Terlambat</option>
      </select>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="table-responsive">
        <table class="table tabel-perpus mb-0 align-middle">
          <thead>
            <tr>
              <th>Judul</th>
              <th>Tanggal pinjam</th>
              <th>Jatuh tempo</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="isi-tabel"></tbody>
        </table>
      </div>
    </div>
    <p id="kosong" class="text-center text-muted mt-4" hidden>Belum ada riwayat.</p>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="riwayat.js"></script>
</body>
</html>
