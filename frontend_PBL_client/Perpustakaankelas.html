<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk - Perpustakaan Kelas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="perpustakaankelas.css">
</head>
<body>
  <main class="container py-5" style="max-width: 440px;">

    <header class="d-flex align-items-center flex-wrap gap-2 mb-4">
      <h1 class="judul-situs h3 mb-0">Perpustakaan Kelas</h1>
      <span class="badge rounded-pill bg-hijau">Halaman Peminjam</span>
    </header>

    <section class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h2 class="judul-kartu h3 mb-3">Masuk</h2>

        <form id="form-login" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label fw-bold">NIS / Username</label>
            <input type="text" class="form-control" id="username" autocomplete="username">
            <div class="invalid-feedback">NIS / Username wajib diisi.</div>
          </div>
          
          <div class="mb-4">
            <label for="password" class="form-label fw-bold">Password</label>
            <input type="password" class="form-control" id="password" autocomplete="current-password">
            <div class="invalid-feedback">Password wajib diisi.</div>
          </div>

          <button type="submit" class="btn btn-hijau w-100">Masuk</button>
          </form>

          <p class="text-center small mt-4 mb-2">Belum punya akun?</p>
          <a href="akunbaru.html" class="btn btn-outline-hijau w-100">Daftar akun baru</a>
          </div>
          </section>
          </main>
          <script src="perpustakaankelas.js"></script>
          </body>
          </html>
